title: PetPawCalc
description: Free calculators and tools for pet owners. Dog age, cat calories, pet costs and more.
url: "https://petpawcalc.com"
baseurl: ""

permalink: /blog/:slug/

future: true

plugins:
  - jekyll-sitemap
  - jekyll-seo-tag

defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
  - scope:
      path: "tools"
    values:
      layout: "tool"
  - scope:
      path: "checklists"
    values:
      layout: "checklist"
  - scope:
      path: ""
    values:
      layout: "default"

exclude:
  - README.md
  - .github
  - handover.md
  - Gemfile
  - Gemfile.lock
