<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ page.title }} — PetPawCalc</title>
  <meta name="description" content="{{ page.description }}">
  <meta name="robots" content="index, follow">
  <link rel="canonical" href="{{ site.url }}{{ page.url }}">

  <meta property="og:title" content="{{ page.title }}">
  <meta property="og:description" content="{{ page.description }}">
  <meta property="og:url" content="{{ site.url }}{{ page.url }}">
  <meta property="og:type" content="website">

  <link rel="stylesheet" href="/css/style.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🐾</text></svg>">

  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-XTS4KRZQE9"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-XTS4KRZQE9');
  </script>
<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-5592663499707350" crossorigin="anonymous"></script>
</head>
<body>
  {% include header.html %}
  <main>
    {{ content }}

    <div class="page-byline no-print">
      Built and maintained by <a href="/about.html">PetPawCalc Team</a> ·
      <a href="/sources.html">Sources</a> ·
      <a href="/editorial-policy.html">Editorial policy</a>
    </div>
  </main>
<style>
.page-byline {
  max-width: 760px;
  margin: 40px auto 0;
  padding: 16px 20px 0;
  border-top: 1px solid var(--border);
  font-size: 0.84rem;
  color: var(--brown-light);
  line-height: 1.7;
}
.page-byline a { color: var(--brown-light); text-decoration: underline; }
.page-byline a:hover { color: var(--orange); }
@media print { .page-byline { display: none !important; } }
</style>

  {% include footer.html %}
</body>
</html>
