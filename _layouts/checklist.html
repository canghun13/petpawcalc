<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ page.title }} — PetPawCalc</title>
  <meta name="description" content="{{ page.description }}">
  <meta name="robots" content="index, follow">
  <link rel="canonical" href="{{ site.url }}{{ page.url }}">

  <meta property="og:title" content="{{ page.title }}">
  <meta property="og:description" content="{{ page.description }}">
  <meta property="og:url" content="{{ site.url }}{{ page.url }}">
  <meta property="og:type" content="website">

  <link rel="stylesheet" href="/css/style.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🐾</text></svg>">

  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-XTS4KRZQE9"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-XTS4KRZQE9');
  </script>
<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-5592663499707350" crossorigin="anonymous"></script>
</head>
<body>
  {% include header.html %}
  <main>
    {{ content }}
  </main>
  {% include footer.html %}

  <script>
    // Shared logic for all /checklists/ pages.
    // Each checklist page provides: <div class="checklist-page" data-checklist-id="unique-id">
    // and checkbox items as: <input type="checkbox" class="checklist-check" data-check-id="some-id">
    (function () {
      const page = document.querySelector('.checklist-page');
      if (!page) return;
      const checklistId = page.getAttribute('data-checklist-id');
      const storageKey = 'petpawcalc:checklist:' + checklistId;
      const checkboxes = Array.from(document.querySelectorAll('.checklist-check'));
      const total = checkboxes.length;

      function loadState() {
        try {
          const raw = localStorage.getItem(storageKey);
          return raw ? JSON.parse(raw) : [];
        } catch (e) {
          return [];
        }
      }

      function saveState(checkedIds) {
        try {
          localStorage.setItem(storageKey, JSON.stringify(checkedIds));
        } catch (e) { /* localStorage unavailable — ignore, just don't persist */ }
      }

      function updateProgress() {
        const doneCount = checkboxes.filter(cb => cb.checked).length;
        const fill = document.getElementById('checklist-progress-fill');
        const text = document.getElementById('checklist-progress-text');
        const pct = total > 0 ? Math.round((doneCount / total) * 100) : 0;
        if (fill) fill.style.width = pct + '%';
        if (text) text.textContent = doneCount + ' of ' + total + ' done';
      }

      function applyState() {
        const checkedIds = loadState();
        checkboxes.forEach(cb => {
          cb.checked = checkedIds.indexOf(cb.getAttribute('data-check-id')) !== -1;
        });
        updateProgress();
      }

      checkboxes.forEach(cb => {
        cb.addEventListener('change', function () {
          const checkedIds = checkboxes.filter(c => c.checked).map(c => c.getAttribute('data-check-id'));
          saveState(checkedIds);
          updateProgress();
        });
      });

      window.resetChecklist = function () {
        if (!confirm('Reset this checklist? This will uncheck everything.')) return;
        checkboxes.forEach(cb => { cb.checked = false; });
        saveState([]);
        updateProgress();
      };

      window.printChecklist = function () {
        const dateEl = document.getElementById('checklist-print-date');
        if (dateEl) {
          dateEl.textContent = new Date().toLocaleDateString('en-US', { year: 'numeric', month: 'long', day: 'numeric' });
        }
        window.print();
      };

      applyState();

      // Optional: age-window countdown (opt-in per checklist page).
      // A checklist page can add <input type="date" id="checklist-age-input" data-window-days="112">
      // plus <div id="checklist-countdown-result"></div> to get a generic "days left in window" countdown.
      // This is generic/reusable so individual checklist pages never need their own <script>.
      const dobInput = document.getElementById('checklist-age-input');
      if (dobInput) {
        const windowDays = parseInt(dobInput.getAttribute('data-window-days') || '0', 10);
        const countdownEl = document.getElementById('checklist-countdown-result');
        const dobStorageKey = storageKey + ':dob';

        function fmtCountdownDate(d) {
          return d.toLocaleDateString('en-US', { month: 'long', day: 'numeric', year: 'numeric' });
        }

        function updateCountdown() {
          const val = dobInput.value;
          if (!val || !countdownEl) {
            if (countdownEl) countdownEl.innerHTML = '';
            return;
          }
          const dob = new Date(val + 'T00:00:00');
          const today = new Date();
          today.setHours(0, 0, 0, 0);
          const windowEnd = new Date(dob);
          windowEnd.setDate(windowEnd.getDate() + windowDays);
          const daysLeft = Math.ceil((windowEnd - today) / (1000 * 60 * 60 * 24));

          if (daysLeft > 0) {
            countdownEl.innerHTML = `<strong>${daysLeft} day${daysLeft === 1 ? '' : 's'} left</strong> in the critical socialization window — it closes on ${fmtCountdownDate(windowEnd)}.`;
            countdownEl.className = 'checklist-countdown checklist-countdown-active';
          } else {
            countdownEl.innerHTML = `The critical socialization window closed on ${fmtCountdownDate(windowEnd)}. Continued exposure is still valuable — see the FAQ below.`;
            countdownEl.className = 'checklist-countdown checklist-countdown-closed';
          }
          try { localStorage.setItem(dobStorageKey, val); } catch (e) { /* ignore */ }
        }

        try {
          const savedDob = localStorage.getItem(dobStorageKey);
          if (savedDob) dobInput.value = savedDob;
        } catch (e) { /* ignore */ }

        dobInput.addEventListener('change', updateCountdown);
        updateCountdown();
      }
    })();
  </script>
</body>
</html>
