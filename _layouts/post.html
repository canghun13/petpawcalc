<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ page.title }} — PetPawCalc</title>
  <meta name="description" content="{{ page.description }}">
  <meta name="robots" content="index, follow">
  <link rel="canonical" href="{{ site.url }}{{ page.url }}">

  <meta property="og:title" content="{{ page.title }}">
  <meta property="og:description" content="{{ page.description }}">
  <meta property="og:url" content="{{ site.url }}{{ page.url }}">
  <meta property="og:type" content="article">

  <link rel="stylesheet" href="/css/style.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🐾</text></svg>">

  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-XTS4KRZQE9"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-XTS4KRZQE9');
  </script>

  <style>
    .post-header { max-width: 760px; margin: 0 auto; padding: 48px 24px 0; }
    .post-tag { font-size: 0.8rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.07em; color: var(--orange); margin-bottom: 12px; }
    .post-header h1 { font-family: var(--font-display); font-size: clamp(1.8rem, 4vw, 2.6rem); font-weight: 700; color: var(--brown); line-height: 1.2; margin-bottom: 12px; }
    .post-meta { font-size: 0.85rem; color: var(--brown-light); margin-bottom: 36px; }
    .post-body { max-width: 760px; margin: 0 auto; padding: 0 24px 80px; }
    .post-body h2 { font-family: var(--font-display); font-size: 1.4rem; font-weight: 600; color: var(--brown); margin: 36px 0 12px; }
    .post-body h3 { font-family: var(--font-display); font-size: 1.1rem; font-weight: 600; color: var(--brown); margin: 24px 0 8px; }
    .post-body p { color: var(--brown-mid); margin-bottom: 18px; line-height: 1.75; }
    .post-body ul, .post-body ol { color: var(--brown-mid); padding-left: 22px; margin-bottom: 18px; }
    .post-body li { margin-bottom: 7px; line-height: 1.65; }
    .post-body a { color: var(--orange); text-decoration: underline; text-underline-offset: 2px; }
    .post-body table { width: 100%; border-collapse: collapse; margin: 8px 0 28px; font-size: 0.92rem; background: var(--white); border: 1px solid var(--border); border-radius: var(--radius-sm); overflow: hidden; }
    .post-body th { background: var(--cream-dark); color: var(--brown); font-weight: 600; text-align: left; padding: 10px 14px; border-bottom: 2px solid var(--border); }
    .post-body td { color: var(--brown-mid); padding: 10px 14px; border-bottom: 1px solid var(--border); }
    .post-body tr:last-child td { border-bottom: none; }
    .post-body tr:nth-child(even) td { background: var(--cream); }
    .post-body table strong { color: var(--brown); }
    @media (max-width: 600px) {
      .post-body table { display: block; overflow-x: auto; white-space: nowrap; }
      .post-body th, .post-body td { padding: 8px 10px; font-size: 0.85rem; }
    }
    .post-cta { background: var(--cream-dark); border: 1px solid var(--border); border-radius: var(--radius); padding: 24px 28px; margin: 36px 0; }
    .post-cta h4 { font-family: var(--font-display); font-size: 1.1rem; color: var(--brown); margin-bottom: 6px; }
    .post-cta p { font-size: 0.9rem; color: var(--brown-mid); margin-bottom: 14px; }
    .post-cta a { display: inline-block; background: var(--orange); color: white; padding: 8px 20px; border-radius: var(--radius-sm); font-size: 0.9rem; font-weight: 600; }
  </style>
<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-5592663499707350" crossorigin="anonymous"></script>

<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "Article",
  "headline": "{{ page.title | escape }}",
  "description": "{{ page.description | escape }}",
  "datePublished": "{{ page.date | date: '%Y-%m-%d' }}",
  "dateModified": "{{ page.date | date: '%Y-%m-%d' }}",
  "author": {
    "@type": "Organization",
    "name": "PetPawCalc",
    "url": "https://petpawcalc.com"
  },
  "publisher": {
    "@type": "Organization",
    "name": "PetPawCalc",
    "url": "https://petpawcalc.com"
  },
  "mainEntityOfPage": {
    "@type": "WebPage",
    "@id": "{{ site.url }}{{ page.url }}"
  }
}
</script>
{% if page.faqs %}
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "FAQPage",
  "mainEntity": [{% for faq in page.faqs %}
    {
      "@type": "Question",
      "name": "{{ faq.q | escape }}",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "{{ faq.a | escape }}"
      }
    }{% unless forloop.last %},{% endunless %}{% endfor %}
  ]
}
</script>
{% endif %}
</head>
<body>
  {% include header.html %}
  <main>
    <div class="post-header">
      <div class="post-tag">{{ page.category }}</div>
      <h1>{{ page.title }}</h1>
      <div class="post-meta">{{ page.date | date: "%B %d, %Y" }} · {{ page.read_time }} min read</div>
    </div>
    <div class="post-body">
      {{ content }}
    </div>
  </main>
  {% include footer.html %}
</body>
</html>
